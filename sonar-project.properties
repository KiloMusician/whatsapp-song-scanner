# SonarLint project configuration
# Exclude Python standard library and virtual environments from analysis

sonar.projectKey=whatsapp-song-scanner
sonar.projectName=WhatsApp Song Scanner
sonar.projectVersion=1.0.0

# Source directories
sonar.sources=src,config
sonar.tests=tests

# Python specific settings
sonar.python.version=3.11,3.12

# Exclusions - Python standard library and dependencies
sonar.exclusions=\
  **/.venv/**,\
  **/venv/**,\
  **/site-packages/**,\
  **/dist-packages/**,\
  **/lib/python*/**,\
  **/Python*/Lib/**,\
  **/AppData/Local/Programs/Python/**,\
  **/__pycache__/**,\
  **/*.pyc,\
  **/htmlcov/**,\
  **/.pytest_cache/**,\
  **/.mypy_cache/**,\
  **/build/**,\
  **/dist/**

# Coverage exclusions
sonar.coverage.exclusions=\
  **/tests/**,\
  **/test_*.py,\
  **/__init__.py

# File size limit (in KB)
sonar.python.file.suffixes=.py
