version: '3.8'

services:
  # MAIN APPLICATION
  song-scanner-bot:
    build:
      context: ..
      dockerfile: docker/Dockerfile
    container_name: whatsapp-song-scanner
    restart: unless-stopped
    ports:
      - "${APP_PORT:-5000}:5000"
    environment:
      - APP_ENV=production
      - LOG_LEVEL=${LOG_LEVEL:-INFO}
      - MARIADB_HOST=mariadb
      - REDIS_HOST=redis
    volumes:
      - ../data:/app/data
      - ../config:/app/config:ro
    env_file:
      - ../.env
    depends_on:
      mariadb:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - scanner-network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:5000/api/v1/health"]
      interval: 30s
      timeout: 10s
      retries: 3

  # MARIADB DATABASE
  mariadb:
    image: mariadb:10.11
    container_name: scanner-mariadb
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${MARIADB_ROOT_PASSWORD:-changeme}
      MYSQL_DATABASE: ${MARIADB_DATABASE:-song_scanner}
      MYSQL_USER: ${MARIADB_USERNAME:-scanner_bot}
      MYSQL_PASSWORD: ${MARIADB_PASSWORD:-changeme}
    ports:
      - "${MARIADB_PORT:-3306}:3306"
    volumes:
      - mariadb_data:/var/lib/mysql
      - ../src/database/schema.sql:/docker-entrypoint-initdb.d/schema.sql:ro
    networks:
      - scanner-network
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 30s
      timeout: 10s
      retries: 3

  # REDIS FOR CACHING
  redis:
    image: redis:7-alpine
    container_name: scanner-redis
    restart: unless-stopped
    ports:
      - "${REDIS_PORT:-6379}:6379"
    volumes:
      - redis_data:/data
    networks:
      - scanner-network
    command: redis-server --appendonly yes
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 30s
      timeout: 10s
      retries: 3

  # EVOLUTION API (OPTIONAL - FOR WHATSAPP)
  evolution-api:
    image: evolutionapi/evolution-api:latest
    container_name: scanner-evolution-api
    restart: unless-stopped
    ports:
      - "8080:8080"
    environment:
      - SERVER_URL=http://evolution-api:8080
      - CORS_ORIGIN=*
      - LOG_LEVEL=info
      - DATABASE_ENABLED=true
      - DATABASE_PROVIDER=postgresql
      - DATABASE_CONNECTION_URI=postgresql://evolution:evolution@postgres:5432/evolution
      - REDIS_ENABLED=true
      - REDIS_URI=redis://redis:6379
    volumes:
      - evolution_data:/evolution/instances
    networks:
      - scanner-network
    depends_on:
      - redis
    profiles:
      - evolution

  # ADMINER (DATABASE UI)
  adminer:
    image: adminer
    container_name: scanner-adminer
    restart: unless-stopped
    ports:
      - "8081:8080"
    networks:
      - scanner-network
    depends_on:
      - mariadb
    profiles:
      - tools

volumes:
  mariadb_data:
  redis_data:
  evolution_data:

networks:
  scanner-network:
    driver: bridge
